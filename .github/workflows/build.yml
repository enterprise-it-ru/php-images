name: build

on:
  push:
    branches: [ main ]
    paths:
      - Dockerfile
      - versions.json
      - tests/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - versions.json
      - tests/**
      - .github/workflows/build.yml
  schedule:
    # Еженедельная пересборка подтягивает патч-релизы PHP и обновления безопасности Debian
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      php:
        description: 'Версии PHP через пробел, например "8.3 8.4". Пусто — все версии'
        required: false
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/php

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
      snapshot: ${{ steps.matrix.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v7

      # По расписанию пропускаются версии со "scheduled": false, при ручном запуске можно выбрать версии
      - name: Build matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ inputs.php }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          versions=$(jq -c --arg event "$EVENT" --arg only "$ONLY" '
            map(select($event != "schedule" or .scheduled != false))
            | map(select($only == "" or (.php | IN($only | split(" ")[]))))
          ' versions.json)
          if [ "$versions" = "[]" ]; then
            echo "::error::Нет версий для сборки. Проверьте versions.json и параметр php"
            exit 1
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          # Номер запуска делает тег снимка уникальным: опубликованные снимки никогда не перезаписываются
          echo "snapshot=$(date -u +%Y%m%d)-$RUN_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.version.php }} (${{ matrix.arch }})
    needs: prepare
    # arm64 собирается на нативном раннере: под QEMU расширения компилируются в разы дольше
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.version.php }}
            DEBIAN_RELEASE=${{ matrix.version.debian }}
            DEBIAN_MIRROR=${{ matrix.version.debian_mirror }}
          load: true
          tags: php-images:test
          cache-from: type=gha,scope=php-${{ matrix.version.php }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.version.php }}-${{ matrix.arch }}

      - name: Smoke test
        run: ./tests/smoke.sh php-images:test

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.version.php }}-fpm-${{ needs.prepare.outputs.snapshot }}
            type=raw,value=${{ matrix.version.php }}-fpm

      # Слои берутся из кэша предыдущего шага, публикуется только digest. Теги ставит задача merge, когда собраны обе архитектуры
      - name: Push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.version.php }}
            DEBIAN_RELEASE=${{ matrix.version.debian }}
            DEBIAN_MIRROR=${{ matrix.version.debian_mirror }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.version.php }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge:
    name: Publish ${{ matrix.version.php }}
    needs: [ prepare, build ]
    # Запускается, даже если упала сборка другой версии: одна сломанная версия не блокирует публикацию остальных
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.version.php }}-*
          merge-multiple: true

      - name: Check that all architectures are built
        run: |
          count=$(find "$RUNNER_TEMP/digests" -type f 2>/dev/null | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::PHP ${{ matrix.version.php }} собран не для всех архитектур ($count из 2), публикация пропущена"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Аннотации индекса нужны ghcr.io, чтобы показать описание и связать пакет с репозиторием
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.version.php }}-fpm-${{ needs.prepare.outputs.snapshot }}
            type=raw,value=${{ matrix.version.php }}-fpm

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Summary
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ matrix.version.php }}-fpm"
          {
            echo "### PHP ${{ matrix.version.php }}"
            jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
